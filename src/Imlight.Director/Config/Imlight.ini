CreatureBlockByTier = 0, 2.5, 5, 10, 20, 30, 35, 40, 45, 50
CreatureDeckAttacks = 4
CreatureDeckSupport = 3
CreatureDeckLevelLead = 2
; Which creatures can stand in on a run's street. Any (default): any non-boss creature of a similar level from
; the whole game. Zone: only the street's own creatures, reshuffled (use this if creatures show up invisible).
StreetCreaturePool = Any
; If true, every spawn on a run's street rolls a fresh random creature. If false, each kind of creature is
; replaced by the same random one for the whole tier, and "defeat" quest goals name it.
StreetCreaturesChangeEverySpawn = false
; If true, a swapped-in creature only looks different: it fights with the health, level, school and deck of
