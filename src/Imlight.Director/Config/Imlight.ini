; rolls it like a dropped pet (random age, stat talents, name, max stats). A vendor that mostly sells jewels sells random jewels and pins (no Magic Weaving, no crown jewels) from
; JewelShopRange levels below to JewelShopRange above the wizard, never above JewelShopMaxLevel. JewelShopCount
; is how many (0 = as many as the vendor normally sells, or 15 for a vendor with no stock here). JewelShops lists
; vendors (NPC template ids or shop title keys) that sell jewels even with no stock of their own here; the default
