DungeonZones = Krokotopia/KT_Krokosphinx/KT_Vault, Krokotopia/KT_Krokosphinx/KT_Retreat
; If true, beating a run's boss completes every quest the wizard still has, with its rewards (no dialogs,
; teleports or follow-up quests), so unfinished street quests don't pile up.
CompleteQuestsAfterBoss = true
; The chance (0 to 100) that completing a quest on a run also gives a random piece of gear for the wizard's
; level: crown gear or ordinary gear, half and half.
QuestItemChance = 50
; Chances (0 to 100) to learn a new spell, shown with the game's "New Spell Learned" window. The spell is one the
