; know yet and has the level for. BattleSpellChance is any won battle, QuestSpellChance any completed quest
; (the end-of-boss auto-completes too), BossSpellChance the tier's boss.
BattleSpellChance = 10
QuestSpellChance = 25
BossSpellChance = 100
; If true, wizards on a run get shadow pips at any level (the gauge fills 25 a round, more with Potions of Shadow).
ShadowPips = true
; If true, wizards on a run have Archmastery (school pips from the Power Orb) at any level, not only from 50.
Archmastery = true
; If true, on a run a school pip of any school, and then a power pip, pays a spell's school pip cost, so the
