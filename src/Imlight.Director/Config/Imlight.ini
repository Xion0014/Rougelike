; The time in seconds that any given download will wait before timing out.
PatchServerDownloadTimeout = 360
LocalWadCachePath = ./cache

[ID Lookup]
; If true, the server writes a searchable list of every item, spell, creature and NPC ID on boot,
; and the in-game .lookup commands can search it. It is built once per GameRevision, in the background.
BuildOnBoot = true
; The folder for the list. Open index.html in a browser to search it, or ids.csv in a spreadsheet.
OutputPath = ./id-lookup

[Randomizer]
; Randomizer mode. If true, the switches below shuffle the game for every character on this server.
; Swaps stay balanced: spells keep their type and pip cost, gear keeps its slot, school and level range,
; treasure cards keep their type and pip cost, and creatures keep their level range.
Enabled = false
; Tame mode, so questing can be done: creatures, creature decks, pips and shadow pips stay normal,
; whatever the switches below say. Schools, spells, drops and the spells you win still shuffle.
Tame = false
; New characters get a random school instead of the one they picked.
RandomizeSchool = false
; Spells from trainers, quests and drops are swapped. Trainers show the swapped spell.
RandomizeSpells = false
; Gear and treasure cards from drops and quest rewards are swapped.
RandomizeDrops = false
; Creatures in the world are swapped for others of a similar level (bosses only swap with bosses).
; A swapped creature still counts for quests as the creature it replaced.
RandomizeCreatures = false
; If true, every spawn rolls a new creature. If false, each creature always swaps to the same one.
CreaturesChangeEverySpawn = false
; Every creature's deck is rolled fresh each spawn: each spell becomes a random spell of the same type and pip cost.
RandomizeCreatureDecks = false
; Cards your gear gives are rolled fresh every battle, the same way.
RandomizeItemCards = false
; Each round gives a random number of pips: usually 1, sometimes 0, 2 or 3, but never 0 when you have none. Applies to creatures too.
RandomizePips = false
; New characters start with this many random spells of up to 3 pips, from any school, already in their starter deck. 0 turns it off.
StartingSpells = 6
; The chance, from 0 to 100, that winning a battle teaches a random spell. Any battle spell in the game
; can come up, including ones players normally never get. 0 turns it off.
SpellAfterBattleChance = 100
; Any text. Changing it reshuffles everything for everyone, so set it before characters are made.
Seed = imlight
; If true, every character gets the same shuffle, for races. If false, each character's shuffle is their own.
SameForEveryone = false
; Each wizard's shadow pip limit is rolled from 1 to 5, and each creature gets shadow magic by chance.
; Needs ShadowPips on in [Battle].
RandomizeShadowPips = false
; How many levels wide each gear and creature level range is.
LevelRange = 10

[Trainers]
; These work with or without randomizer mode.
; Each spell that needs another spell first needs a different, random one instead, picked from the same
; trainer's lower level spells, so every spell can still be reached.
RandomizeSpellRequirements = false
; No spell needs another spell first. Overrides RandomizeSpellRequirements.
NoSpellRequirements = false
; Any level can train any spell.
NoLevelRequirements = false
; Training spells costs no training points, even from other schools.
FreeTraining = false
; Every level gained also gives training points. How many is set just below.
TrainingPointPerLevel = false
; How many training points each level gives when TrainingPointPerLevel is on (0 to 100).
TrainingPointsPerLevel = 1
; Any player can type .gaintp <amount> (1 to 100) to give themselves training points.
PlayersCanGainTrainingPoints = true

[World]
; If true, every door and teleport works without the quest, level or event it normally needs (such as Nightside in the Commons).
OpenAllDoors = false

[Battle]
; If true, a spell that fizzles still costs its mana, the same as if it had worked.
ManaOnFizzle = false
; If true, spells never use up mana, and arriving in the Commons fills mana back to full.
UnlimitedMana = false
; If true, a won battle (not one everybody fled) drops a health, a mana and a gold wisp where it was fought.
; Nobody picking them up makes them vanish after 2 minutes.
BattleWisps = true
; If true, a power pip only half used on a spell (a 3 pip spell paid with 2 power pips) always gives
; the spare pip back as a normal pip, like having 100% pip conserve.
FullPipConserve = false
; If true, the Daybreaker and Nightbringer enchantments still add their damage but no longer add a pip to the card's cost.
NoPipsFromDaybreakerNightbringer = false
; If true, once every pip slot is full, each round turns one power pip into a school pip of your own school.
; School pips pay for the school pip cost some higher level spells have.
SchoolPips = true
; If true, school pips count as any school pips: a school pip of any school pays for any spell's school pip cost.
AnySchoolPips = true
; If true, a wizard's school pip gauge fills each round, and once full their next pip is a school pip.
; No stats needed.
GainSchoolPips = true
; How much the school pip gauge fills each round, from 0 to 100 (25 means a school pip every 4 rounds).
SchoolPipChance = 25
; If true, school pips come in a random school instead of your own.
RandomSchoolPips = false
; If true, wizards and creatures can get shadow pips, which shadow spells cost. They have their own slots,
; and wizards get shadow magic unlocked so the shadow slots and gauge show.
ShadowPips = true
; The most shadow pips a wizard can hold at once. 0 means no limit.
PlayerShadowPipLimit = 0
; The fewest shadow pips a wizard holds. If they have fewer, they top back up to this each round. 0 turns it off.
PlayerShadowPipMin = 0
; The most shadow pips a creature can hold at once. 0 means no limit.
CreatureShadowPipLimit = 0
; If true, creatures can get shadow pips too. If false, only wizards can.
CreatureShadowPips = true
; If true, each creature gets shadow magic only by chance, rolled every battle (see CreatureShadowMagicChance).
RandomCreatureShadowPips = false
; The chance, from 0 to 100, that a creature gets shadow magic when RandomCreatureShadowPips is on.
CreatureShadowMagicChance = 50
; How much the shadow gauge fills each round, from 0 to 100; a full gauge gives a shadow pip. 0 uses each
; wizard's or creature's own shadow pip rating from level and gear, which is 0 for low levels.
ShadowPipChance = 0
; If true, wizards get shadow pips even without the shadow pip rating stat (the gauge fills 25 each round,
; or ShadowPipChance if that is set).
NaturalShadowPips = false

[Archmastery]
; Like the game: from level 50 a wizard's Power Orb fills each round (fastest for whoever has the most
; Archmastery in the battle). Each point turns a power pip into a school pip of the school picked on the deck
; (your own school by default). With 3 points left, a white pip becomes a power pip. The orb holds up to 7.
; While this is on, it replaces GainSchoolPips under [Battle] for wizards who have Archmastery.
Enabled = true
; If true, wizards under level 50 get the level 50 Archmastery too.
AllLevels = true
; Extra Archmastery for every wizard (stands in for gear and jewels, which add it in the game).
BonusRating = 0
; How much the fastest orb fills each round, from 0 to 1 (1 means a school pip every round).
; 0 uses the game's own number.
FillPerRound = 0

[CrownShop]
; The crown shop sells what SpiralDB's CrownShop tabs list, for crowns or gold. The Level 50 Elixir is free.
; The biggest the shop list sent to the game may be, in bytes. A message that is too big makes the game drop
; the connection; the whole shop fits in about 25000.
MaxListBytes = 30000

[Bazaar]
; How many treasure cards each of Elik's school tabs shows (most 1000, 0 turns them off). Every school has fewer
; than this, so 500 shows them all. Sending too many at once makes the game lose its connection.
TreasureCards = 500

[Die Delete]
; Die = Delete mode. If true, a character that dies in battle and is still dead when the battle ends is deleted for good.
; Fleeing does not count, and neither does the tutorial battle. The player is disconnected and told why.
Enabled = false

[PetCasting]
; Pet May Cast talents (ported from Niduus's fork). The pet casts the game's pet copy of the card, free, on its owner
; (a card that hits enemies goes at an enemy), with the pet's May Cast animation. It can go off when you or a teammate
; casts a spell, takes damage, is healed or passes. false: pets never May Cast.
Enabled = true
; Chance in percent (0 to 100) that a May Cast goes off when you or a teammate casts a spell.
OnCast = 30
; Chance in percent that a May Cast goes off when you or a teammate takes damage.
OnDamage = 30
; Chance in percent that a May Cast goes off when you or a teammate is healed.
OnHeal = 30
; Chance in percent that a May Cast goes off when you or a teammate passes.
OnPass = 0
; The most May Casts one pet can do in a round.
MaxPerRound = 5
; true: a May Cast can set off more May Casts (your pet's own or a teammate's pet's), like any other cast.
Chain = true
; The most May Casts in a row one spell can set off.
MaxChain = 10
; The most seconds the round waits for each May Cast to play. 0 (default): each cast's own animation time (less a
; second, which the timings run long by), so long ones like Meteor Storm play out. Raise it if turns start early.
CastSeconds = 0
; true: May Casts cost no pips, also on your screen.
ZeroCost = true
; true: the cast is flagged as the pet's, so the game plays the pet's May Cast animation. false: it shows as yours.
ShowAsPetCast = true
; Each May Cast can have its own chances as cast/damage/heal/pass under its card's name without spaces, such as
; TowerShield = 10/25/5/0 (the server log names the setting for each May Cast it reads). Empty uses the ones above.

[Roguelike]
; Roguelike run mode. Each tier is a street and a boss: the wizard fights on the street until the timer runs
; out, then must beat the tier's boss, then goes to the shop zone to spend gold and training points before
; typing .run next for the next tier. Players can type .run status at any time.
Enabled = false
; If true, a new run opens with a welcome from Merle Ambrose (StartDialogActor, a template id). The wizard is
; sent to the first street, and its countdown starts, when they close it (or after two minutes).
StartDialog = true
StartDialogActor = 38168
; The welcome window only shows the game's own text, so it is made of lines the game already has (one page
; each), and the run's rules show in a box on top of it. Defaults: "You've done well, but your trial is only
; beginning...", "Be careful going farther down Unicorn Way... Beware!" and "Be careful, young Wizard. This will
; be a tough battle. Good luck!"
StartDialogLines = WizQst99C9_00000017, WizQst955B_00000043, CinematicDialogs_00000124
; After the last tier: congratulations in a box, then Merle Ambrose asks this game line as a yes/no window
; ("Do you believe that you are ready to continue your journey?"). Yes continues to the next arc, No takes a break
; and logs the wizard out; they come back at the shops. .run continue and .run break answer it too.
ArcPromptLine = WizQst1293E3_00000014
; The tiers that end an arc: after one, the same continue-or-take-a-break question. The last tier always asks.
ArcEndTiers = 5, 10
; If true, during a run every zone plays a random track from MusicTracks instead of its own music, and the
; track comes back after each battle (battles keep their own music). Type .run music for another track.
RandomMusic = false
; The tracks a run picks from, as the game's zones name them. Leave out to use the default list: themes from
; every world, Wizard City to Aquila.
; MusicTracks = |Music|WorldData|WC/WC_RavenWood.ogg, |Music|WorldData|AV/AV_Hub.mp3
; If true, every battle on a run plays a random combat theme from BattleMusicTracks instead of the zone's own,
; and the zone's music (or the run's random track) comes back after the win. Works with or without RandomMusic.
RandomBattleMusic = false
; Flags sent with each track (0 by default: 1 made the game ignore its own music setting). Players can type
; .run music off to hear the game's own zone music instead.
MusicFlags = 0
; Outside battles, switch to a new random track this often, in minutes (0 = never), so music never runs out.
MusicChangeMinutes = 3
; The combat themes battles pick from. Leave out to use the default list: battle music from every world.
; BattleMusicTracks = |Music|WorldData|WC/Combat1Test.ogg, |Music|WorldData|AV/AV_Combat.mp3
; If true, new wizards get a random school and a random name, whatever was picked on the creation screens.
; The game draws those screens itself, so they still show; click through them and the server rolls the wizard.
RandomCharacters = true
; If true, a wizard that dies in battle is deleted for good (the same as [Die Delete] Enabled).
Permadeath = true
; How long the wizard fights on each street before the boss, in minutes. Time only counts while online.
; TierNMinutes sets one tier's street on its own.
StreetMinutes = 15
; One line per tier, in order: the street zone, a comma, then the boss zone. Tiers stop at the first
; missing number. Use full zone paths: the server writes every zone name to id-lookup\zones.txt on boot,
; and .run here shows the zone you are standing in. A tier's boss is beaten by winning a battle that has
; a creature flagged as a boss, after the street timer runs out. The last tier ends the run.
; TierNQuests (optional) lists quests, comma-separated, handed to the wizard on first reaching that tier's
; street, with their requirements skipped. TierNBossQuests does the same on first reaching the boss zone.
; TierNBoss (optional) names the boss that ends the tier (part of its name, or its template id), for boss
; zones with more than one boss; without it, the first boss beaten in the boss zone ends the tier. Each starts the street's main quest chain, which then carries on
; through the street's NPCs. Tier 1's is Merle Ambrose's first quest, since the run skips the Commons.
; One tier per world, ending with Malistaire.
; Wizard City: Unicorn Way, then Lord Nightshade in the Haunted Cave.
Tier1 = WizardCity/WC_Streets/WC_Unicorn, WizardCity/WC_Streets/Interiors/WC_HauntedCave_T1
Tier1Quests = WC-COMMONS-MAIN-001
Tier1Minutes = 10
; Krokotopia: the Krokosphinx quest line (the longest in Krokotopia, and the most experience), then Krokopatra
; in the Temple of Storms. The temple only gives a side quest of its own, so the main quest that sends you to
; defeat Krokopatra is handed out there.
Tier2 = Krokotopia/KT_Krokosphinx/KT_ChampHall, Krokotopia/KT_Tomb/KT_TempleOfStorms
Tier2Quests = KT-SPHub-C01-001
Tier2Minutes = 15
Tier2BossQuests = KT-CRYHub-C01-004
Tier2Boss = Krokopatra
; Marleybone: Chelsea Court, then Dr. Katzenstein's lab. The lab only gives side quests of its own, so the main
; quest to defeat Katzenstein is handed out there.
Tier3 = Marleybone/MB_Station/MB_ChelseaCourt, Marleybone/MB_Station/Interiors/MB_HydePark_T2
Tier3Quests = MB-AIR2-C02-001
Tier3Minutes = 15
; Leader of the Pack (defeat Sammy O'Leary in Hyde Park's den).
Tier3BossQuests = MB-AIR1-C03-003
; Sammy O'Leary shows up as Meowiarty (39848), with Sammy's health, level and deck. Any boss ends the tier.
Tier3BossSwap = 39848
Tier3Boss =
; MooShu: the war battlefields.
Tier4 = MooShu/MS_Death/MS_Death_Zone1_BurialGround, MooShu/MS_Plague/Interiors/MS_Plague3_T3
; A Hand From Beyond (the Burial Ground's main quest), Lost Memories and Dead Poets Society (its creature quests).
Tier4Quests = MS-DTH1-C01-001, MS-DTH1-C02-001, MS-DTH1-C02-002
Tier4Minutes = 15
; The Jade Oni (77457) takes the boss's place, with its own 8,000 health, level and deck.
Tier4BossSwap = 77457
Tier4BossSwapStats = Own
Tier4Xp = 15
Tier4Boss =
; Dragonspyre: the Crystal Grove, then Malistaire's lair.
Tier5 = DragonSpire/DS_A2_Battle/DS_A2Z1_Hatchery, DragonSpire/DS_A3_Kings/Interiors/DS_MalistaireLair
; Textbook Example (the Hatchery's main quest) and Save the Drakes (its creature quest).
Tier5Quests = DS-NEC1-C01-001, DS-NEC1-C03-001
Tier5Minutes = 15
; The Final Countdown, moved on to its "defeat Malistaire" goal. (Quest@Goal moves a quest on to that goal.)
Tier5BossQuests = DS-ACAD-C01-005@Goal 3
; The lair's other creatures are random (TierNBossCreatures = Random), and Malistaire fights with a random deck
; (TierNBossDeck = Random: CreatureDeckAttacks + BossDeckExtra attacks, CreatureDeckSupport + BossDeckExtra others).
Tier5BossCreatures = Random
Tier5BossDeck = Random
Tier5Xp = 20
Tier5Boss = Malistaire Drake
Tier5BossExp = 630000

; ---- Arc 2 (tiers 6 to 10, levels 50 to 100): a boss rush ----
; Every arc 2 tier goes straight from the shops to its boss. From Malistaire on (FlatRatesFromTier), battles give
; experience and gold at x1, and each boss's TierNBossExp gives the levels for the next one instead:
; Malistaire 630,000 (to level 60), then 1.1M (70), 3M (80), 5.5M (90), 11M (100) and 18M (110).
; TierN = none, <boss zone> skips the street: the tier goes straight from the shops to its boss.
; TierNLevel: the level the tier's bosses draw random-deck spells up to (and the shops and trainers stock up to the
; highest one). TierNXp: the tier's experience multiplier, instead of XpMultiplier.
; TierNBossRoom: creature template ids that take the place of every creature in the boss room, in turn.
; TierNBossSwap: a creature template id that takes the boss's place, or Random for a random boss of a similar level
; (picked by the run), keeping the boss's own health, level and deck.
; Mithraya, the Sun boss of the Test of the Spheres (CL-Sun-Boss-R10). CL-MAIN-094, the Test of the Spheres quest,
; is handed out in her room moved on to its last goal, defeating her.
