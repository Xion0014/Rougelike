; If true, each run's streets are the wizard's own private copy, and every creature there (wisps aside) is
; swapped for one of a similar level, picked by the run's random seed and tier: each run meets different
; creatures. Swapped creatures still count for quests, and "defeat" quest goals show the new creature's name.
RandomStreetCreatures = true
; If false, the creatures stay the ones the street (and its dungeons) normally have; with RandomCreatureDecks they
; still fight with a random deck. True: they are swapped as above.
SwapStreetCreatures = true
; If true, the dungeons and rooms a street's quests lead into (Krokotopia's Hall of Champions and Grand Arena,
; Marleybone's houses...) swap their creatures too while the street is on. Bosses keep their place, and any
; creature beaten in one counts for that place's "defeat" goals.
RandomDungeonCreatures = true
; If true, the creatures a run swaps in (or, with SwapStreetCreatures off, the street's own) fight with a random deck
; instead of their own (bosses keep theirs):
; CreatureDeckAttacks attack spells and CreatureDeckSupport others (blades, shields, heals, traps, globals),
; all normal trainer spells (no developer, monster or boss cards) at up to the creature's level plus
; CreatureDeckLevelLead, of its school when it has enough. Health and level stay the original creature's.
RandomCreatureDecks = true
; Extra attack and support spells a boss's random deck gets (TierNBossDeck = Random).
BossDeckExtra = 3
; If true, critical hits on a run are simple. A wizard's chance to crit is their critical rating / 1000 (100 = 10%,
; 1000 = 100%); a creature's is CreatureCritByTier for the run's tier (tier 1 first). Only attacks crit, for double
; damage. A critical can be blocked: a wizard's chance is their block rating / 1000, a creature's CreatureBlockByTier.
; A blocked critical shows the block and does normal damage. False: the game's usual crit-against-block formula.
SimpleCriticals = true
; Pets on a run: a won battle drops a pet PetDropChance% of the time, a tier's boss BossPetDropChance%. A dropped pet
; is a random pet at a random age (Baby to Ultra), with a pool of PetTalentPool stat talents only (no May Casts or
; card talents), one shown per age from Teen to Mega (five at Mega and Ultra), and every stat at its maximum
; ([Pets] MaxStrength and the others, 260). Staff can test it with .run pet [baby|teen|adult|ancient|epic|mega|ultra].
PetDropChance = 5
BossPetDropChance = 50
PetTalentPool = 10
; Jewels on a run: a won battle drops a random jewel or pin the wizard has the level for, JewelDropChance% of the
; time. Every new item's sockets start open (they cost crowns in the real game). Taking a jewel out shatters it
; unless [Jewels] KeepShatteredJewels is true (or the jewel is No Shatter).
JewelDropChance = 100
; Spells never given, taught or put in a creature's deck: any with a damage or heal number above MaxSpellDamage
; (the 99,999 damage developer spells), and these by shown name, comma-separated.
MaxSpellDamage = 3000
BannedSpells = Pwn
; The chance (0 to 100) that each talent in a run pet's pool is a May Cast talent (such as Guardian Wall:
; May Cast Tower Shield) instead of a stat talent. [PetCasting] sets how often they go off. 0: stat talents only.
PetMayCastShare = 30
; The wooden chests on the streets. On a run each holds one random reward, picked by these weights ("kind:weight",
; comma-separated): gold (ChestGoldMin to ChestGoldMax, not multiplied by GoldMultiplier), gear (ordinary or crown,
; in the wizard's level range), jewel (a jewel or pin), spell (one the wizard can learn) or pet (rolled like a
; dropped pet). A reward that cannot be given (nothing fits) becomes gold.
ChestRewards = gold:35, gear:25, jewel:20, spell:10, pet:10
ChestGoldMin = 1000
ChestGoldMax = 10000
; Silver chests (the lock-picking game) on a run: winning gives SilverChestItems rewards picked by SilverChestRewards
; ("kind:weight": gear, jewel or spell), SilverChestGoldMin to SilverChestGoldMax gold (not multiplied) and, with a
; SilverChestPetChance% chance, a run pet as well.
SilverChestRewards = gear:40, jewel:35, spell:25
SilverChestItems = 2
SilverChestGoldMin = 10000
SilverChestGoldMax = 50000
SilverChestPetChance = 20
; Run shops (with RandomShops on): a vendor that mostly sells pets (the Shopping District pet shop) sells
