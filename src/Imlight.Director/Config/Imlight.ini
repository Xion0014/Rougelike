[Global Settings]
GameRevision = r806919.Wizard_1_610
; If true, the servers will refuse connections if the game revision does not match.
EnforceRevision = false

[Logging]
LogPath = ./logs/log.txt
; The minimum log level to be written to the log file. Valid values are: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
LogLevel = DEBUG
LogFormat = {Timestamp:yyyy-MM-dd HH:mm:ss.fff} {Level:u3} {CallingSpace} : {Message:lj} {NewLine}{Exception}
SeqSinkUrl = http://localhost:5341

[Locale]
Language = en-US

[Login Server]
; The internal name for the login server. This is not a realm name.
LoginServerName = Imlight.Login
LoginServerPort = 12000
LoginPlayerLimit = 1000
MaxAllowedCharactersPerAccount = 6
; The time in seconds that a user can be AFK before being disconnected.
LoginAfkTimeout = 360
; The time in seconds between AFK checks.
LoginAfkCheckInterval = 60
; If true, nobody is ever disconnected for being idle (LoginAfkTimeout is ignored).
DisableIdleKick = true
; If true, a username the server does not know becomes a new account when it logs in. The game only sends a
; one-way proof of the password, so such an account lets any password in until one is set (the launcher's
; account box). For a server on your own PC; keep it false on a server others can reach.
AutoCreateAccounts = false
; The least auth level every account has (None, QualityAssurance, HallMonitor, Developer, Administrator); an
; account below it is raised when it logs in. The Spiral Gauntlet Test Realm sets Administrator so its testers can use
; every command. Keep None on any other server.
AccountAuthLevel = None

[Game Server]
; The internal name for the game server. This is not a realm name.
GameServerName = Imlight.Game
GameServerPort = 12333
GameServerPlayerLimit = 1000
; Leave this at 127.0.0.1: each player is then sent the address they can reach (this computer, your home
; network, a VPN or the internet). Any other address here is sent to everyone not on this computer.
GameServerIP = 127.0.0.1
; The address friends on the internet use to reach this computer (your public IP or a web address).
; Empty finds it by itself.
PublicAddress =
; The number of game servers (realms) the Director will create.
GameServerCount = 3
; The number of game servers that can be created.
MaxGameServersAllowed = 3
; Comma-separated list of realm names. Must have at least GameServerCount entries.
RealmNames = Centaur,Pegasus,Phoenix
; The time in seconds that a session key is valid.
SessionKeyValidityTime = 28800
; The time in seconds that a trade invite waits for the other player before it counts as declined.
TradeInviteTimeoutSeconds = 60

[Combat]
; The current health percent a creature must to decide healing itself on a prepare turn.
HealingThreshhold = 0.75
; The percent chance a creature will heal itself on a prepare turn.
HealingPercentChance = 0.5
; The percent chance a creature will pass on a prepare turn.
PreparePassChance = 0.33
; The amount of aggro increase a player will receive upon damaging a creature.
DamagedAggroIncrease = 5
; The amount of aggro increase a player will receive upon healing a teammate.
HealingAggroIncrease = 3
; The amount of aggro increase a player will receive upon using the 'Provoke' spell on a creature.
ProvokeAggroIncrease = 20
; The amount of aggro decrease a player will receive upon using the 'Pacify' spell on a creature.
PacifyAggroDecrease = 50

[PvP]
; If false, the PvP kiosks answer that PvP is temporarily disabled and nobody can queue.
Enabled = true
; If true, the duel modifiers of a league (level scaling, banned items) also apply to practice matches.
ApplyLeagueRules = false
; Seconds a team has to plan on its half of a round in a practice duel.
Practice.PlanningSeconds = 20
; If true, the team that acts first alternates every round of a PvP duel.
SwapFirstTeamEachRound = true
; Seconds a finished match waits for the clients to finish their victory scene before the players return to the lobby.
