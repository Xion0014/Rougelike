Tier7BossSwap = 469944
Tier7BossSwapStats = Own
Tier7BossDeck = Random
Tier7Level = 70
Tier7Boss =
Tier7BossExp = 3000000
Tier8 = none, Avalon/Interiors/AV_Z02_JabberwockLair
Tier8BossDeck = Random
Tier8Level = 80
