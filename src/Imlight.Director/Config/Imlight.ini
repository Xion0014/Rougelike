; ---- Arc 3 (tiers 11 to 13, levels 110 to 130): another boss rush ----
; Each boss is moved into a room that works, as itself (TierNBossSwap, own health, level and deck stats), with a random
; deck. TierNBossLevel gives whatever experience it takes to reach that level (from the game's experience table), so
