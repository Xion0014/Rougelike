; Critical +20-100, Block +20-100, Armor Piercing +1-2%, Power Pip Chance +1-10%, Shadow Pip Rating +1-10,
; Pip Conserve +1-10% and Archmastery +1-10. Type .run to see the totals.
BoostChance = 75
; If true, on a run the Crown Shop button shows your stats (gear and potions together) in chat instead of the
; shop. .run stats shows them too.
ShopButtonShowsStats = true
; If true, on a run the Commons, Home, world gate and Recall buttons do nothing, and the zones in BlockedZones
