# Publishes a GitHub release on every push to the roguelike branch (versions 1.0.<run number>),
# and when a version tag (v1.2.3) is pushed. Installed ImlightManager.exe and launchers update
# themselves from the newest release here, so every push reaches every install.
#
# ImlightManager.exe is always built and attached. It installs this fork on a PC, building it
# from that PC's own Wizard101 files, and adds the Control Panel.
#
# The launcher is always built and attached. Installed launchers pick up new releases from here,
# so a release is how an update reaches every server owner.
#
# The server needs Imcodec generator inputs from the game client, which cannot live in this
# public repository. To build the server and installer too, add a repository secret named
# IMCODEC_GENERATOR_INPUTS holding a base64-encoded zip with two folders:
#   ObjectProperty/   the wiztype type dump (*.json)
#   MessageLayer/     the *Messages*.xml files
# On Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes("inputs.zip")) | Set-Clipboard
# Without the secret, attach ImlightServer-win-x64.zip by hand (installer\build-installer.ps1 makes it).
name: Release

on:
  push:
    branches: ['roguelike/run-loop']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3'
        required: true

permissions:
  contents: write

# One release at a time, so versions come out in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GENERATOR_INPUTS: ${{ secrets.IMCODEC_GENERATOR_INPUTS }}
      # The branch ImlightManager.exe installs and updates when built from a tag or by hand.
      DEFAULT_INSTALL_BRANCH: roguelike/run-loop
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $branch = $env:DEFAULT_INSTALL_BRANCH
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
            $branch = $env:DEFAULT_INSTALL_BRANCH
          } else {
            # A branch push: number the release by this workflow's run count.
            $version = "1.0.${{ github.run_number }}"
            $branch = "${{ github.ref_name }}"
          }
          $version = $version.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Build the launcher
        shell: pwsh
        run: |
          dotnet publish src/Imlight.Launcher/Imlight.Launcher.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} -o installer/publish/launcher
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path installer/publish/launcher/* -DestinationPath release/ImlightLauncher-win-x64.zip

      - name: Build ImlightManager.exe
        # Builds this fork on the player's own PC from their own game files, so it needs no secret.
        # The Game Files tab decodes game data with the type dump Imcodec ships for its tests.
        shell: pwsh
        run: |
          $typeInput = "submodule/Imcodec/src/Imcodec.ObjectProperty/GeneratorInput"
          New-Item -ItemType Directory -Force $typeInput | Out-Null
          Copy-Item submodule/Imcodec/test/CodeGen/Inputs/*.json $typeInput/
          dotnet publish src/Imlight.Setup/Imlight.Setup.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} -p:ImlightEdition=Manager `
            -p:ImlightBranch=${{ steps.version.outputs.branch }} -o out/manager
          Copy-Item out/manager/ImlightManager.exe release/

      - name: Build the Spiral Gauntlet launcher
        # The playful roguelike launcher: installs the roguelike server on the player's PC, updates it and plays on it.
        shell: pwsh
        run: |
          dotnet publish src/Imlight.Setup/Imlight.Setup.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} -p:ImlightEdition=Roguelike `
            -p:ImlightBranch=${{ steps.version.outputs.branch }} -o out/roguelike
          Copy-Item out/roguelike/SpiralRoguelike.exe release/
          # The launcher is now called Spiral Gauntlet; installed launchers still update from SpiralRoguelike.exe.
          Copy-Item out/roguelike/SpiralRoguelike.exe release/SpiralGauntlet.exe

      - name: Add the generator inputs
        if: env.GENERATOR_INPUTS != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/inputs.zip", [Convert]::FromBase64String($env:GENERATOR_INPUTS))
          Expand-Archive "$env:RUNNER_TEMP/inputs.zip" "$env:RUNNER_TEMP/inputs"
          $codec = "submodule/Imcodec/src"
          New-Item -ItemType Directory -Force "$codec/Imcodec.ObjectProperty/GeneratorInput", "$codec/Imcodec.MessageLayer/GeneratorInput" | Out-Null
          # Swap the bundled type dump the Manager was built with for this one.
          Remove-Item "$codec/Imcodec.ObjectProperty/GeneratorInput/*.json" -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP/inputs/ObjectProperty/*" "$codec/Imcodec.ObjectProperty/GeneratorInput/"
          Copy-Item "$env:RUNNER_TEMP/inputs/MessageLayer/*" "$codec/Imcodec.MessageLayer/GeneratorInput/"

      - name: Build the server
        if: env.GENERATOR_INPUTS != ''
        shell: pwsh
        run: |
          dotnet publish src/Imlight.Director/Imlight.Director.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} -o installer/publish/server
          Set-Content -Path installer/publish/server/version.txt -Value "${{ steps.version.outputs.version }}" -NoNewline
          Compress-Archive -Path installer/publish/server/* -DestinationPath release/ImlightServer-win-x64.zip

      - name: Build the installer
        if: env.GENERATOR_INPUTS != ''
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer/Imlight.iss
          Copy-Item installer/output/ImlightLauncherSetup.exe release/

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $branch = "${{ steps.version.outputs.branch }}"
          $commit = "${{ github.sha }}".Substring(0, 7)
          $notes = "Built from $branch at $commit. Players: download SpiralGauntlet.exe and press the big button; it sets up the " +
                   "roguelike on your own PC from your Wizard101 files and keeps itself updated. Server owners: ImlightManager.exe " +
                   "installs the roguelike server from the $branch branch with the full control panel."
          if (-not $env:GENERATOR_INPUTS) {
            $notes += " The launcher in this release cannot update the server by itself; use ImlightManager.exe."
          }
          gh release create $tag (Get-ChildItem release/*).FullName --title "$tag (roguelike)" --notes $notes `
            --target "${{ github.sha }}" --latest
